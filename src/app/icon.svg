<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The question, in the site's own display face.

    The domain is not a question — it is a conditional with the second half
    missing. "If you died today…" has no main clause; the reader supplies it.
    This is the punctuation the name withholds, which is a reason no other site
    can borrow: it comes from the name rather than from the subject.

    Both paths are the real Big Shoulders glyph for "?", lifted from
    bigshoulders700.ttf (glyph 568) and converted from its TrueType quadratics
    to SVG — the same letterform the score band and the verdict already wear,
    not an approximation of it. Baked as outlines so the icon needs no font at
    runtime. The dot is a rectangle because that is what the face draws; a hand
    version of this used a circle and was subtly, unnameably wrong.

    Two deliberate departures from the raw glyph, and only two:
      · The dot is nudged down, opening the gap from 5 to 7.2 units. At 16px
        the font's own spacing lets the two merge into one blob.
      · Nothing else. An earlier draft grew the dot 18% "so it survives 16px";
        measured, the font's dot already renders 2.68 x 1.95px there, and the
        enlargement pushed its height to a fractional 2.30px — the exact
        half-lit-rows problem that rules out thin strokes elsewhere.

    All red, no gold, and that is the point rather than an omission. Gold on
    this site arrives once, late, on ground the red has drained out of (see
    verdict-screen.tsx). A favicon is the earliest thing a stranger sees, so
    gold here would spend the arrival before the Law has said anything —
    METHOD.md:119, "Grace is never offered before the Law has done its work."
  -->
  <rect width="64" height="64" rx="14" fill="#060404"/>
